<head>
  <meta charset="utf-8">

  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f2e9" id="theme-color">
  <!-- ── 内容安全策略 ────────────────────────────────────────────────────
       把各处注释一直声称的「connect-src 'none'、网络一律走 Java」落成事实。
       页面跑在 https://appassets.androidplatform.net（WebViewAssetLoader），'self' 即它。
       逐条证据（2026-10-31 对 assets 全量 grep 的结论）：
       · script-src 'unsafe-inline'：head 主题脚本、白屏兜底判据脚本、下面的 CSP
         钩子、兜底面板的 onclick，全是刻意的内联。
       · script-src 'unsafe-eval'：hxm/hxm.js 的 WebAssembly.instantiate 是 AGE动漫
         解析层的活路径（wasm 字节 base64 内联在 hxm.wasm.js，不经网络）。Chrome 58
         （minSdk 出厂 WebView）上 wasm 只认 'unsafe-eval'，'wasm-unsafe-eval' 要
         Chrome 96+；主页面自身没有 eval/new Function，等 WebView 底线上到 96+
         可以收窄成 'wasm-unsafe-eval'。
       · img-src * data:：封面直连兜底把远程 https 原址直接喂 <img>（cover.js
         loadInto），解密成功的封面是 data:image/jpeg;base64，app.css 的背景图是
         data: SVG。全项目无 createObjectURL/toDataURL，不需要 blob:。
       · connect-src 'none'：主页面全部 js/html 里 fetch / XMLHttpRequest /
         WebSocket / EventSource / sendBeacon 零使用（唯一命中在 spider-host.html
         的注释里，那是另一份文档、自带自己的 CSP）；hxm/http.js 走 HG_BRIDGE，
         数据面全走 AndroidHost 桥（JS 接口对象，不是 CSP 管的网络原语）。
       · media-src 'none'：唯一的 <video> 在 feed-player.js 的 render() 里，那段
         状态机不可达（播放全程在原生 VLC）；没有 <audio>/new Audio。
       · form-action 'none'：全部表单 preventDefault 后走桥，没有 .submit() 调用。
       · frame-src / object-src / base-uri：无 iframe、无 object/embed、无 <base>。
       spider-host.html 有自己的 meta CSP，与本页互不影响。 -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src * data:; font-src 'self' data:; connect-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <title>AIIvideo</title>
  <!-- 必须是第一个脚本：放后面就漏掉前面所有脚本的解析错误，而「某个分片没打进包 /
       语法坏了导致白屏」正是它最该抓到的那类故障。见 js-errors.js 文件头。 -->
  <script src="js-errors.js"></script>
  <!-- CSP 违规观察钩子：真机上验证策略没误伤靠它。track（上报）定义在 app.js ——
       整包最后一个脚本，这里比它早得多，所以违规先进缓冲，track 一就绪当场补发；
       三个定时器兜「早期违规之后再也没有违规」的场景。缓冲上限 20 条：每条要走
       一次 report 桥，有上限就不会被坏循环刷爆（Java 侧 ReportQueue 另有自己的
       防刷）。手写 ES5，同下面那段判据脚本的约束。若这份策略把 js-errors.js 本身
       误拦了，这里收不到违规，但 boot-fail 面板会亮 stage:'hook' —— 两条路都通。 -->
  <script>
    (function () {
      var pending = [];
      function clip(value) {
        var text = String(value == null ? '' : value);
        return text.length > 120 ? text.slice(0, 120) : text;
      }
      function flush() {
        if (typeof track !== 'function') return;
        while (pending.length) {
          try { track('js', 'csp_violation', pending.shift()); } catch (ignored) {}
        }
      }
      document.addEventListener('securitypolicyviolation', function (event) {
        if (pending.length < 20) {
          pending.push({ directive: clip(event.violatedDirective), block: clip(event.blockedURL) });
        }
        flush();
      });
      window.setTimeout(flush, 3000);
      window.setTimeout(flush, 8000);
      window.setTimeout(flush, 15000);
    })();
  </script>
  <script>
    /* 主题要在 CSS 之前定下来。放到 app.js 里会先画一帧浅色再翻成深色，
       冷启动的闪白在 OLED 上特别明显。这里只读偏好、算一次，不碰任何 DOM。 */
    (function () {
      var mode = 'system';
      try { mode = localStorage.getItem('hgpref:theme') || 'system'; } catch (error) {}
      if (mode !== 'light' && mode !== 'dark') mode = 'system';
      var dark = mode === 'dark' || (mode === 'system' && window.matchMedia
        && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var root = document.documentElement;
      root.dataset.theme = dark ? 'dark' : 'light';
      root.dataset.themePref = mode;
      root.style.colorScheme = dark ? 'dark' : 'light';
    })();
  </script>

<body>
  <!-- ── 白屏兜底 ────────────────────────────────────────────────────────
       2.0.23 线上有两台设备是这个样子：App 起来了、页面也加载了，但 14 个 JS
       文件全倒在解析阶段（`?.` 要 Chrome 80，`||=` 要 Chrome 85，而 minSdk 26
       的出厂 WebView 是 Chrome 58），除了 app_open 一个业务事件都没有 —— 用户
       看到的是一片空白，然后卸载。

       这块面板只做一件事：把「为什么是空的」说出来，并告诉他怎么修。
       样式写成内联是故意的 —— 它不能依赖 app.css 加载成功。
       不用 flex 也是故意的：`hidden` 靠 UA 的 display:none 生效，内联只要写了
       display 就会把它覆盖掉，那这面板从一开始就盖在页面上。 -->
  <div id="boot-fail" hidden role="alert" style="position:fixed;top:0;right:0;bottom:0;left:0;z-index:99999;overflow:auto;padding:28px;background:#f5f2e9;color:#2b2118;font:15px/1.7 system-ui,-apple-system,'Noto Sans SC',sans-serif">
    <h2 style="margin:0 0 14px;font-size:17px">界面没能加载出来</h2>
    <p id="boot-fail-why" style="margin:0 0 12px"></p>
    <p id="boot-fail-ua" style="margin:0 0 16px;font:12px/1.5 ui-monospace,SFMono-Regular,monospace;word-break:break-all;opacity:.65"></p>
    <p style="margin:0 0 18px"><button type="button" onclick="location.reload()" style="padding:11px 22px;border:0;border-radius:10px;background:#2b2118;color:#fff;font:15px system-ui,-apple-system,sans-serif">重试</button></p>
    <p style="margin:0;font-size:13px;opacity:.75">一直这样的话：在应用商店里搜「Android System WebView」把它更新到最新；找不到的话，把 Chrome 也更新一次（两者共用同一个内核）。</p>
  </div>
  <script>
    /*
     * 白屏兜底的判据脚本。
     *
     * **必须手写 ES5。** 它要照顾的正是「旧 WebView 连 app.js 都解析不了」的机器，
     * 这里出现一个箭头函数或者 const，兜底自己就成了新的白屏。jscheck 里有一条
     * 断言用 acorn 按 ES5 解析这段（含 head 里那段主题脚本）。
     *
     * **判据是标记在不在，不是等了多久。** 慢网络下首屏本来就要几秒，按时间报
     * 会误杀；而 app.js 第一句就是 `window.__hgParsed = 1`，只要整份解析通过就
     * 一定执行。所以先给 5 秒（本地 assets，正常几十毫秒就到了），还没等到就先
     * 把面板亮出来；之后每 2 秒再看一眼，标记一出现就收回去 —— 慢机器不会因为
     * 下载慢被误判成故障。
     */
    (function () {
      var panel = document.getElementById('boot-fail');
      if (!panel) return;
      var shown = false;
      var tries = 0;

      function show() {
        if (shown || window.__hgParsed === 1) return;
        shown = true;
        // 钩子活着 = 异常上报这条路是通的，那么 app.js 没到就只有一种解释：
        // 它整份没解析过。钩子也没活着，说明这个包或者运行环境更早就坏了。
        var hookAlive = window.__hgJsHook === 1;
        var why = hookAlive
          ? '这个版本的界面脚本没能运行。多半是系统 WebView 太旧，认不出里面的新语法。'
          : '连异常钩子都没能运行，这个安装包可能不完整，重装一次试试。';
        var ua = navigator.userAgent || '';
        var whyBox = document.getElementById('boot-fail-why');
        var uaBox = document.getElementById('boot-fail-ua');
        if (whyBox) whyBox.textContent = why;
        if (uaBox) uaBox.textContent = ua;
        panel.hidden = false;
        try {
          if (window.AndroidHost && typeof window.AndroidHost.reportJs === 'function') {
            window.AndroidHost.reportJs(JSON.stringify({
              kind: 'js',
              name: 'boot_fail',
              props: {
                stage: hookAlive ? 'parse' : 'hook',
                code: 'boot_fail',
                msg: why,
                // UA 里带着 WebView 的真实版本号，是判断「到底多旧」的唯一依据。
                trace: ua,
                where: String(location.href).slice(0, 120)
              }
            }));
          }
        } catch (ignored) {}
      }

      function poll() {
        tries += 1;
        if (window.__hgParsed === 1) {
          if (shown) panel.hidden = true;
          return;
        }
        show();
        if (tries < 15) window.setTimeout(poll, 2000);
      }

      window.setTimeout(poll, 5000);
    })();
  </script>
